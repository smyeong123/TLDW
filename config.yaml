# TLDW configuration. Secrets live in .env, never here.

# Where videos come from:
#   watch_later - Watch Later snapshots sent by the TLDW browser extension (extension/)
#   playlist    - playlist_name below, read through the YouTube API
source: watch_later

# Only used with source: playlist (the API can't read Watch Later).
playlist_name: TLDW

# Playlist on your own channel where finished shorts are added (created if missing).
output_playlist_name: TLDW Shorts

# Topics the classifier may assign. Anything else is filtered out (but left in the playlist).
topics:
  - ML / AI
  - Systems design
  - Finance
  - Korean history

# "match" = same language as the source video; or a language code like "ko" / "en".
output_language: match

# Classifier confidence below this -> filtered_out
confidence_threshold: 0.6

# Skip sources longer than this (minutes), with a logged reason.
max_source_minutes: 120

# Watched at least this fraction (0..1) -> treated as watched, never summarized.
watched_threshold: 0.5

# `tldw run` warns when the newest Watch Later snapshot is older than this.
snapshot_max_age_hours: 48

# Port for `tldw serve` (listens on 127.0.0.1 only) that the extension posts to.
serve_port: 8765

# Upload quota is ~6/day; keep this small. Telegram delivery has no such cap.
max_shorts_per_run: 5

# Any of: youtube, telegram
delivery:
  - youtube
  - telegram

# edge-tts voice per output language. Add more keys as needed.
tts_voice:
  ko: ko-KR-SunHiNeural
  en: en-US-AriaNeural

# Only used if captions are missing AND you explicitly opt in. Default off: captions only.
whisper_fallback: false

# Paths (relative to the repo root unless absolute)
state_db: state.db
cache_dir: cache
out_dir: out
logs_dir: logs
